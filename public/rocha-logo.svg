<svg viewBox="0 0 540 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Chrome / Platinum Metallic Gradient -->
    <linearGradient id="chrome3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#f1f5f9" />
      <stop offset="42%" stop-color="#cbd5e1" />
      <stop offset="48%" stop-color="#94a3b8" />
      <stop offset="52%" stop-color="#334155" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Chrome Outer Rim Bevel Gradient -->
    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Sapphire Blue 3D Metallic Gradient for Aperture -->
    <radialGradient id="sapphire3D" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="25%" stop-color="#2563eb" />
      <stop offset="65%" stop-color="#1d4ed8" />
      <stop offset="90%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Blade Highlight Gradient -->
    <linearGradient id="bladeShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Electric Blue Glowing Line Gradient -->
    <linearGradient id="electricBlueLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.2" />
      <stop offset="15%" stop-color="#2563eb" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Electric Cyan Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for Chrome Letters -->
    <filter id="letterShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <g id="rocha-official-logo">
    <!-- ======================================================== -->
    <!-- 1. CIRCULAR "R" EMBLEM ON THE LEFT                       -->
    <!-- ======================================================== -->
    <g id="emblem-r" filter="url(#letterShadow)">
      <!-- Outer Metallic Ring -->
      <circle cx="76" cy="62" r="44" stroke="url(#chromeBevel)" stroke-width="7.5" fill="none" />
      <!-- Inner Thin Accent Ring -->
      <circle cx="76" cy="62" r="47.5" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.6" fill="none" />

      <!-- Specular Lens Flare Glint on top-left of the ring -->
      <circle cx="48" cy="34" r="6" fill="#ffffff" opacity="0.8" />
      <circle cx="48" cy="34" r="2.5" fill="#ffffff" />
      <ellipse cx="48" cy="34" rx="14" ry="1.5" transform="rotate(-35 48 34)" fill="#ffffff" opacity="0.9" />

      <!-- Stylized Modern Metallic "R" Inside Ring -->
      <path
        d="M 54 44 
           H 78 
           C 88 44, 94 50, 94 58 
           C 94 65, 88 71, 79 72 
           L 96 86 
           H 85 
           L 71 73 
           H 62 
           V 86 
           H 54 
           Z 
           M 62 51 
           V 66 
           H 77 
           C 83 66, 86 63, 86 58 
           C 86 54, 83 51, 77 51 
           Z"
        fill="url(#chrome3D)"
        stroke="#475569"
        stroke-width="0.75"
      />
    </g>

    <!-- ======================================================== -->
    <!-- 2. "O" - 3D METALLIC BLUE APERTURE SHUTTER LENS          -->
    <!-- ======================================================== -->
    <g id="aperture-o" transform="translate(188, 62)">
      <!-- Outer Sapphire Blue Base -->
      <circle cx="0" cy="0" r="41" fill="url(#sapphire3D)" stroke="#1e40af" stroke-width="1.5" />

      <!-- 6 Curved 3D Aperture Blades -->
      <g filter="url(#letterShadow)">
        <!-- Blade 1 -->
        <path d="M 0 -41 C 18 -41, 32 -28, 38 -14 C 26 -7, 14 0, 7 12 C 0 8, -5 2, -7 -8 C -4 -22, -2 -34, 0 -41 Z" fill="url(#bladeShine)" stroke="#0f172a" stroke-width="0.75" />
        <!-- Blade 2 -->
        <path d="M 38 -14 C 42 4, 38 22, 28 34 C 18 24, 7 14, -6 13 C -6 6, -2 0, 6 -6 C 18 -12, 28 -14, 38 -14 Z" fill="url(#bladeShine)" stroke="#0f172a" stroke-width="0.75" />
        <!-- Blade 3 -->
        <path d="M 28 34 C 14 42, -4 42, -20 36 C -14 22, -7 11, -13 0 C -7 -3, 0 -3, 8 2 C 18 10, 24 22, 28 34 Z" fill="url(#bladeShine)" stroke="#0f172a" stroke-width="0.75" />
        <!-- Blade 4 -->
        <path d="M -20 36 C -34 28, -41 14, -41 0 C -28 -4, -15 -8, -7 -20 C 0 -15, 4 -8, 6 2 C 4 16, 2 28, -20 36 Z" fill="url(#bladeShine)" stroke="#0f172a" stroke-width="0.75" />
        <!-- Blade 5 -->
        <path d="M -41 0 C -41 -18, -32 -32, -18 -38 C -11 -25, -4 -13, 8 -13 C 6 -5, 2 0, -6 6 C -18 12, -28 12, -41 0 Z" fill="url(#bladeShine)" stroke="#0f172a" stroke-width="0.75" />
        <!-- Blade 6 -->
        <path d="M -18 -38 C -2 -42, 14 -40, 28 -30 C 18 -18, 10 -7, 13 6 C 7 3, 0 3, -8 -2 C -16 -10, -18 -24, -18 -38 Z" fill="url(#bladeShine)" stroke="#0f172a" stroke-width="0.75" />
      </g>

      <!-- Center Camera Eye / Iris Sphere -->
      <circle cx="0" cy="0" r="16" fill="#0b1736" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="0" cy="0" r="13" fill="url(#sapphire3D)" />
      <!-- Pupil Core -->
      <circle cx="0" cy="0" r="7" fill="#030712" />
      <!-- Specular Highlight Dot -->
      <circle cx="-3" cy="-3" r="3" fill="#ffffff" opacity="0.95" />
      <circle cx="2" cy="2" r="1" fill="#60a5fa" opacity="0.8" />
    </g>

    <!-- ======================================================== -->
    <!-- 3. "C H A" - POLISHED 3D CHROME TYPOGRAPHY               -->
    <!-- ======================================================== -->
    <g id="letters-cha" filter="url(#letterShadow)">
      <!-- Letter C -->
      <text
        x="248"
        y="88"
        font-family="'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="78"
        font-weight="800"
        fill="url(#chrome3D)"
        stroke="#475569"
        stroke-width="0.5"
      >
        C
      </text>

      <!-- Letter H -->
      <text
        x="328"
        y="88"
        font-family="'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="78"
        font-weight="800"
        fill="url(#chrome3D)"
        stroke="#475569"
        stroke-width="0.5"
      >
        H
      </text>

      <!-- Letter A -->
      <text
        x="414"
        y="88"
        font-family="'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="78"
        font-weight="800"
        fill="url(#chrome3D)"
        stroke="#475569"
        stroke-width="0.5"
      >
        A
      </text>
    </g>

    <!-- ======================================================== -->
    <!-- 4. GLOWING ELECTRIC BLUE HORIZONTAL DIVIDER LINE         -->
    <!-- ======================================================== -->
    <g id="electric-line">
      <!-- Glow Underlay -->
      <line
        x1="26"
        y1="116"
        x2="506"
        y2="116"
        stroke="#2563eb"
        stroke-width="5"
        stroke-linecap="round"
        filter="url(#neonGlow)"
        opacity="0.8"
      />
      <!-- Sharp Foreground Line -->
      <line
        x1="26"
        y1="116"
        x2="506"
        y2="116"
        stroke="url(#electricBlueLine)"
        stroke-width="3"
        stroke-linecap="round"
      />

      <!-- Center Starburst Flare Glint on the line -->
      <g transform="translate(266, 116)">
        <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.6" filter="url(#neonGlow)" />
        <ellipse cx="0" cy="0" rx="34" ry="2" fill="#ffffff" />
        <ellipse cx="0" cy="0" rx="2" ry="10" fill="#ffffff" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
      </g>
    </g>

    <!-- ======================================================== -->
    <!-- 5. "F O T O   &   V I D E O" SUBTITLE                    -->
    <!-- ======================================================== -->
    <text
      x="266"
      y="146"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Cinzel', Georgia, sans-serif"
      font-size="17"
      font-weight="700"
      letter-spacing="18"
      fill="url(#chrome3D)"
      filter="url(#letterShadow)"
    >
      FOTO &amp; VIDEO
    </text>
  </g>
</svg>
